name: release

# First publish is manual (`npm publish --access public`), then configure
# npm Trusted Publishing for this repository, and every v* tag publishes itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:gui
      - run: node --experimental-strip-types scripts/check-gui-bundle.ts
      - run: npm publish --provenance --access public
