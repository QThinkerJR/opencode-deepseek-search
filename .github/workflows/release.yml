name: release

# First publish is manual (`npm publish --access public`), then configure
# npm Trusted Publishing for this repository, and every v* tag publishes itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:gui
      - run: node --experimental-strip-types scripts/check-gui-bundle.ts
      # A release may be published by hand (the first one always is). Skipping an
      # existing version keeps the tag build green instead of failing on 403.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@qthinker/opencode-deepseek-search@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@qthinker/opencode-deepseek-search@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
